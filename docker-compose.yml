services:
  api:
    build:
      context: ./apps/api
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      PORT: 8000
    ports:
      - "8000:8000"

  web:
    image: node:20-slim
    working_dir: /repo
    command: sh -c "npm install && npm run dev:web -- --hostname 0.0.0.0"
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - .:/repo
